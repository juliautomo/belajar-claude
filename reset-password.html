<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="posthog-config.js"></script>
<script src="meta-pixel.js"></script>
  <title>Reset Password — Belajar Claude</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAFA; --border: #E8E8E8;
      --ink: #111111; --ink-2: #777777;
      --accent: #6C47FF;
      --font: 'Geist', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background: var(--bg);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle, #D8D8DC 1px, transparent 1px);
      background-size: 26px 26px; opacity: 0.5;
      mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, black 20%, transparent 80%);
    }
    .card {
      background: #fff; border-radius: 20px; padding: 44px 40px 36px;
      max-width: 400px; width: 100%;
      box-shadow: 0 4px 40px rgba(0,0,0,0.08);
      border: 1px solid var(--border); position: relative; z-index: 1;
    }
    .logo { font-size: 17px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.4px; margin-bottom: 28px; display: block;
      text-decoration: none; }
    .logo span { color: var(--accent); }
    h2 { font-size: 18px; font-weight: 700; color: var(--ink);
      margin-bottom: 6px; letter-spacing: -0.3px; }
    p.sub { font-size: 14px; color: var(--ink-2); margin-bottom: 24px; line-height: 1.6; }
    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="password"], .pw-wrap input[type="text"] {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 14px; color: var(--ink); outline: none;
      transition: border-color 0.2s; margin-bottom: 14px;
      font-family: inherit; background: #fff;
    }
    input[type="password"]:focus, .pw-wrap input[type="text"]:focus { border-color: var(--accent); }
    .pw-wrap { position: relative; width: 100%; margin-bottom: 14px; }
    .pw-wrap input[type="password"], .pw-wrap input[type="text"] {
      width: 100%; box-sizing: border-box; padding-right: 42px; margin-bottom: 0;
    }
    input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear { display: none; }
    input::-webkit-credentials-auto-fill-button { display: none !important; }
    input::-webkit-strong-password-auto-fill-button { display: none !important; }
    .pw-toggle {
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px; margin: 0;
      background: transparent; background-color: transparent;
      border: none; box-shadow: none; outline: none; padding: 0;
      border-radius: 8px; cursor: pointer;
      color: var(--ink-3); display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, background-color 0.15s;
    }
    .pw-toggle:hover { color: var(--ink-2); background-color: var(--surface-2); }
    .pw-toggle:focus-visible { box-shadow: 0 0 0 2px var(--accent-glow); }
    .pw-toggle svg { width: 18px; height: 18px; display: block; }
    .pw-toggle .icon-eye-off { display: none; }
    .pw-toggle.showing .icon-eye { display: none; }
    .pw-toggle.showing .icon-eye-off { display: block; }
    .btn {
      width: 100%; padding: 13px; background: var(--ink); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background 0.2s; font-family: inherit;
    }
    .btn:hover:not(:disabled) { background: #333; }
    .btn:disabled { background: #9CA3AF; cursor: not-allowed; }
    .msg {
      margin-top: 14px; padding: 12px 14px; border-radius: 10px;
      font-size: 13px; text-align: center; line-height: 1.6; display: none;
    }
    .msg.success { background: #ECFDF5; color: #065F46; display: block; }
    .msg.error   { background: #FEE2E2; color: #991B1B; display: block; }
    .back { display: block; text-align: center; margin-top: 20px;
      font-size: 13px; color: var(--ink-2); text-decoration: none; }
    .back:hover { color: var(--ink); }
    #invalid-section { text-align: center; }
    #invalid-section p { font-size: 14px; color: var(--ink-2); margin-bottom: 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="index.html">belajar<span>claude</span></a>

    <!-- Valid recovery token: show new password form -->
    <div id="reset-section" style="display:none;">
      <h2>Buat Password Baru</h2>
      <p class="sub">Masukkan password baru kamu di bawah ini.</p>
      <label for="new-password">Password Baru</label>
      <div class="pw-wrap">
        <input type="password" id="new-password" placeholder="Minimal 6 karakter" autocomplete="new-password" />
        <button type="button" class="pw-toggle" onclick="togglePw('new-password', this)" aria-label="Tampilkan password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.1 6.1C3.51 7.86 1 12 1 12s4 8 11 8a9.26 9.26 0 0 0 5.9-2.1"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <label for="confirm-password">Konfirmasi Password</label>
      <div class="pw-wrap">
        <input type="password" id="confirm-password" placeholder="Ulangi password baru" autocomplete="new-password" />
        <button type="button" class="pw-toggle" onclick="togglePw('confirm-password', this)" aria-label="Tampilkan password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.1 6.1C3.51 7.86 1 12 1 12s4 8 11 8a9.26 9.26 0 0 0 5.9-2.1"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <button class="btn" id="reset-btn" onclick="doReset()">Simpan Password Baru →</button>
      <div class="msg" id="reset-msg"></div>
    </div>

    <!-- Invalid / missing token -->
    <div id="invalid-section" style="display:none;">
      <h2>Link Tidak Valid</h2>
      <p>Link reset password sudah kadaluarsa atau tidak valid. Silakan minta link baru.</p>
      <a href="login.html" class="btn" style="display:block;text-decoration:none;text-align:center;">
        Minta Link Reset Baru
      </a>
    </div>

    <!-- Loading state -->
    <div id="loading-section">
      <p style="text-align:center;color:var(--ink-2);font-size:14px;">Memverifikasi...</p>
    </div>

  </div>

  <!-- Moved here from <head> (perf): these were blocking first paint on every load. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    // Supabase JS v2 uses PKCE flow by default — recovery link arrives as ?code=...
    // which fires SIGNED_IN (not PASSWORD_RECOVERY). We detect auth params in the URL
    // to distinguish "came here via reset email" from "already logged in, navigated here".
    (function() {
      var loaded = false;
      var hasAuthParams = window.location.search.includes('code=') ||
                          window.location.hash.includes('access_token');

      sbClient.auth.onAuthStateChange(function(event, session) {
        if (loaded) return;
        loaded = true;
        document.getElementById('loading-section').style.display = 'none';

        if (event === 'PASSWORD_RECOVERY') {
          // Implicit flow: explicit recovery event
          document.getElementById('reset-section').style.display = 'block';
        } else if (session && hasAuthParams) {
          // PKCE flow: signed in via recovery code in URL
          document.getElementById('reset-section').style.display = 'block';
        } else if (session && !hasAuthParams) {
          // Already logged in, navigated here manually
          window.location.href = 'dashboard.html';
        } else {
          // No valid token
          document.getElementById('invalid-section').style.display = 'block';
        }
      });

      // Fallback: if no auth event fires within 4s, show invalid
      setTimeout(function() {
        if (!loaded) {
          loaded = true;
          document.getElementById('loading-section').style.display = 'none';
          document.getElementById('invalid-section').style.display = 'block';
        }
      }, 4000);
    })();

    function togglePw(inputId, btn) {
      var input = document.getElementById(inputId);
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.classList.toggle('showing', !showing);
      btn.setAttribute('aria-label', showing ? 'Tampilkan password' : 'Sembunyikan password');
    }

    async function doReset() {
      var newPw = document.getElementById('new-password').value;
      var confPw = document.getElementById('confirm-password').value;
      var btn = document.getElementById('reset-btn');
      var msg = document.getElementById('reset-msg');

      if (!newPw || newPw.length < 6) return showMsg(msg, 'error', 'Password minimal 6 karakter.');
      if (newPw !== confPw) return showMsg(msg, 'error', 'Konfirmasi password tidak cocok.');

      btn.disabled = true; btn.textContent = 'Menyimpan...';
      msg.className = 'msg';

      var res = await sbClient.auth.updateUser({ password: newPw });
      if (res.error) {
        showMsg(msg, 'error', res.error.message);
        btn.disabled = false; btn.textContent = 'Simpan Password Baru →';
      } else {
        showMsg(msg, 'success', 'Password berhasil diubah! Mengalihkan ke dashboard...');
        setTimeout(function() { window.location.href = 'dashboard.html'; }, 1500);
      }
    }

    function showMsg(el, type, text) {
      el.className = 'msg ' + type;
      el.textContent = text;
    }
  </script>
</body>
</html>
