<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Belajar Claude</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="course-card-shared.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#FAFAFA;--surface:#FFFFFF;--surface-2:#F5F5F7;
  --border:#EBEBEB;--border-strong:#D8D8D8;
  --ink:#111111;--ink-2:#888888;--ink-3:#BBBBBB;
  --accent:#6C47FF;--accent-2:#8B6DFF;--accent-dim:rgba(108,71,255,0.08);--accent-glow:rgba(108,71,255,0.18);
  --green:#16A34A;--green-dim:rgba(22,163,74,0.08);--green-border:rgba(22,163,74,0.2);
  --amber:#D97706;--amber-dim:rgba(217,119,6,0.08);
  --font:'Geist',sans-serif;--serif:'Fraunces',Georgia,serif;
  --nav-h:58px;--sidebar-w:280px;--r:14px;
}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,#DDDDE0 1px,transparent 1px);background-size:28px 28px;opacity:0.5;mask-image:radial-gradient(ellipse 80% 80% at 50% 0%,black 30%,transparent 100%);}
body::after{content:'';position:fixed;top:-200px;right:-100px;z-index:0;pointer-events:none;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(108,71,255,0.07) 0%,transparent 65%);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(250,250,250,0.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.brand{font-family: var(--font);font-size: 17px;font-weight: 700;color:var(--ink);text-decoration:none;letter-spacing: -0.4px;}
.brand span{color: var(--accent);}
.nav-right{display:flex;align-items:center;gap:12px;}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-uname{font-size:13px;font-weight:500;color:var(--ink-2);}
.btn-nav{font-family:var(--font);font-size:13px;font-weight:500;color:var(--ink-2);background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;transition:all 0.18s;}
.btn-nav:hover{color:var(--ink);border-color:var(--border-strong);background:var(--surface);}
.btn-accent{font-family:var(--font);font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;border-radius:9px;padding:8px 18px;cursor:pointer;box-shadow:0 2px 12px var(--accent-glow);transition:all 0.18s;}
.btn-accent:hover{transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow);}

/* LAYOUT */
.layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;padding-top:var(--nav-h);position:relative;z-index:1;}

/* SIDEBAR */
.sidebar{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));border-right:1px solid var(--border);background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);padding:28px 16px;display:flex;flex-direction:column;gap:24px;overflow-y:auto;}
.profile-block{padding:0 6px;}
.profile-sec-label{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;}
.profile-name{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px;}
.profile-email{font-size:11px;color:var(--ink-3);margin-bottom:10px;word-break:break-all;}
.profile-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;color:var(--green);background:var(--green-dim);border:1px solid var(--green-border);padding:3px 9px;border-radius:100px;}
.chip-dot{width:5px;height:5px;border-radius:50%;background:var(--green);}
.nav-menu{display:flex;flex-direction:column;gap:1px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:all 0.15s;text-decoration:none;}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600;}
.ni-icon svg{width:15px;height:15px;flex-shrink:0;}
.sidebar-stats{display:flex;flex-direction:column;gap:6px;margin-top:auto;}
.ss-label{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;padding:0 4px;margin-bottom:2px;}
.ss-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.ss-name{font-size:12px;color:var(--ink-2);}
.ss-val{font-size:15px;font-weight:700;}
.ss-val.g{color:var(--green);}
.ss-val.p{color:var(--accent);}

/* MAIN */
.main{padding:40px 44px;display:flex;flex-direction:column;gap:36px;min-width:0;}
.loading-screen{text-align:center;padding:80px 20px;color:var(--ink-2);font-size:14px;}

/* GREETING */
.greeting{display:flex;align-items:flex-end;justify-content:space-between;animation:up 0.5s ease both;}
.g-eyebrow{font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:0.04em;margin-bottom:8px;}
.g-h1{font-family:'Inter',sans-serif;font-weight:700;font-size:clamp(28px,3.5vw,46px);letter-spacing:-1px;line-height:1.12;color:var(--ink);}
.g-h1 em{font-style:normal;font-weight:700;color:var(--accent);}
.g-sub{font-size:13px;color:var(--ink-3);margin-top:8px;}
.g-pill{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--accent-dim),rgba(139,109,255,0.08));border:1px solid rgba(108,71,255,0.15);padding:10px 18px;border-radius:12px;font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;align-self:flex-start;}

/* CONTINUE SPOTLIGHT — highlights the enrolled-but-unfinished course closest to
   completion, so there's always one clear "pick up where you left off" card above
   the full Kursus Kamu list. Ported from dashboard-redesign-preview.html; uses this
   file's own --serif/--font (Fraunces/Geist) rather than the preview's Instrument Serif. */
.spotlight{animation:up 0.5s 0.03s ease both;}
.spot-card{background:linear-gradient(120deg,var(--ink) 0%,#1e1e22 60%,#232028 100%);border-radius:20px;padding:32px 36px;display:flex;align-items:center;gap:28px;position:relative;overflow:hidden;color:#fff;cursor:pointer;transition:transform 0.25s ease;}
.spot-card:hover{transform:translateY(-2px);}
.spot-card::before{content:'';position:absolute;top:-80px;left:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(139,109,255,0.32),transparent 70%);pointer-events:none;}
.spot-card::after{content:'';position:absolute;bottom:-100px;right:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.06),transparent 70%);pointer-events:none;}
.spot-ring{position:relative;width:96px;height:96px;flex-shrink:0;}
.spot-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.spot-ring-bg{fill:none;stroke:rgba(255,255,255,0.12);stroke-width:6;}
.spot-ring-fill{fill:none;stroke:url(#spotRingGrad);stroke-width:6;stroke-linecap:round;stroke-dasharray:264;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);}
.spot-ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:#fff;}
.spot-info{flex:1;min-width:0;position:relative;}
.spot-eyebrow{font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.spot-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:#FFD84D;animation:spotBlink 1.6s ease-in-out infinite;}
@keyframes spotBlink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.spot-title{font-family:var(--serif);font-size:26px;letter-spacing:-0.3px;margin-bottom:6px;}
.spot-meta{font-size:13px;color:rgba(255,255,255,0.55);}
.spot-meta b{color:#fff;font-weight:600;}
.spot-action{position:relative;flex-shrink:0;}
.btn-spot{font-family:var(--font);font-size:14px;font-weight:600;color:var(--ink);background:#fff;border:none;border-radius:12px;padding:13px 24px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;}
.btn-spot:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.35);}
.spot-ripple{position:absolute;border-radius:50%;background:rgba(108,71,255,0.25);transform:scale(0);animation:spotRippleAnim 0.6s ease-out;pointer-events:none;}
@keyframes spotRippleAnim{to{transform:scale(3.5);opacity:0;}}
@media(max-width:640px){.spot-card{flex-direction:column;align-items:flex-start;text-align:left;}.spot-action{align-self:stretch;}.btn-spot{width:100%;justify-content:center;}}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;animation:up 0.5s 0.07s ease both;}
.s-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 20px;position:relative;overflow:hidden;transition:all 0.2s;}
.s-card:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,0.06);border-color:var(--border-strong);}
.s-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity 0.2s;}
.s-card.sp::before{background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.s-card.sg::before{background:linear-gradient(90deg,#16A34A,#4ADE80);}
.s-card.sa::before{background:linear-gradient(90deg,#D97706,#FCD34D);}
.s-card:hover::before{opacity:1;}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.s-badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:100px;}
.s-badge.p{background:var(--accent-dim);color:var(--accent);}
.s-badge.g{background:var(--green-dim);color:var(--green);}
.s-badge.a{background:var(--amber-dim);color:var(--amber);}
.s-num{font-family:var(--serif);font-size:36px;letter-spacing:-1.5px;line-height:1;margin-bottom:4px;}
.s-num.p{color:var(--accent);}
.s-num.g{color:var(--green);}
.s-num.a{color:var(--amber);}
.s-lbl{font-size:12px;color:var(--ink-3);}

/* SEC HEAD */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3);display:flex;align-items:center;gap:10px;}
.sec-title::after{content:'';width:40px;height:1px;background:var(--border);display:inline-block;}

/* ENROLLED */
.enrolled-list{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.enrolled-card{padding:22px 28px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--border);transition:background 0.15s;cursor:pointer;}
.enrolled-card:last-child{border-bottom:none;}
.enrolled-card:hover{background:var(--surface-2);}
.enrolled-idx{font-size:11px;font-weight:700;color:var(--ink-3);width:20px;flex-shrink:0;}
.enrolled-thumb{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.et1{background:linear-gradient(135deg,#EEF0FF,#DDE0FF);}
.et2{background:linear-gradient(135deg,#F0F9FF,#D9EFFE);}
.et3{background:linear-gradient(135deg,#F0FDF4,#DCFCE7);}
.et4{background:linear-gradient(135deg,#FFF7ED,#FDE8C8);}
.enrolled-info{flex:1;min-width:0;}
.enrolled-info h3{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prog-row{display:flex;align-items:center;gap:10px;}
.prog-pct{font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap;min-width:36px;}
.prog-bar{flex:1;height:5px;background:var(--border);border-radius:10px;overflow:hidden;}
.prog-fill{height:100%;border-radius:10px;background:var(--accent);transition:width 0.5s;}
.prog-lbl{font-size:11px;color:var(--ink-3);white-space:nowrap;}
/* Paket nav */
.paket-nav-label{font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;padding:12px 10px 6px;}
.paket-nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:all 0.15s;}
.paket-nav-item:hover{background:var(--surface-2);color:var(--ink);}
.paket-nav-prog{flex:1;height:2px;background:var(--border);border-radius:4px;overflow:hidden;max-width:60px;}
.paket-nav-fill{height:100%;background:var(--accent);border-radius:4px;}
.resume-btn{background:var(--ink);color:#fff;text-decoration:none;font-family:var(--font);font-size:12px;font-weight:600;padding:8px 16px;border-radius:9px;white-space:nowrap;flex-shrink:0;transition:all 0.2s;border:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.12);}
.resume-btn:hover{opacity:0.85;transform:translateY(-1px);}

/* BADGE */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.badge-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px;transition:all 0.18s;}
.badge-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(22,163,74,0.1);border-color:var(--green-border);}
.badge-ico{width:40px;height:40px;border-radius:10px;background:var(--green-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.badge-ico svg{width:18px;height:18px;color:var(--green);}
.badge-title{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3;margin-bottom:4px;}
.badge-pill{display:inline-block;font-size:10px;font-weight:600;color:var(--green);background:var(--green-dim);border:1px solid var(--green-border);padding:2px 8px;border-radius:100px;}
.badge-meta{font-size:11px;color:var(--ink-3);margin-top:2px;}

/* EXPLORE */
.explore-carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:10px 4px 16px;}
.explore-carousel::-webkit-scrollbar{display:none;}
.explore-card{position:relative;min-width:200px;max-width:200px;scroll-snap-align:start;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:all 0.2s;}
/* No box-shadow here on purpose — a blurred shadow under a small rounded card tends to
   read as a squared-off halo rather than following the card's curve. Border + a faint
   tint instead, which stays crisp at any zoom/scroll position. */
.explore-card:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--accent-dim);}
/* .cc-soon dimming rule lives in course-card-shared.css — shared across every
   coming-soon card component on the site, don't redefine it here. */
.ex-thumb{height:72px;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
.ex-thumb .lih-illustration{transform:scale(1.3);}
.ex-t1{background:linear-gradient(135deg,#EEF0FF,#DDE0FF);}
.ex-t2{background:linear-gradient(135deg,#FFF7ED,#FDE8C8);}
.ex-t3{background:linear-gradient(135deg,#FDF4FF,#F5D0FE);}
/* Shared with index.html's course-library illustrations (markup lives in
   course-illustrations.js) — same @keyframes/animation classes needed here so the
   little animated details (running dog, blinking cursor, pulsing sparkle, etc.) play
   the same way in this smaller carousel card. */
.lih-illustration{width:100%;height:100%;display:block;}
@keyframes lihBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lihLegA{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes lihLegB{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes lihGround{from{stroke-dashoffset:0}to{stroke-dashoffset:-24}}
@keyframes lihTailWag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
@keyframes lihScribble{0%,100%{stroke-dashoffset:0;opacity:0.75}50%{stroke-dashoffset:10;opacity:0.35}}
@keyframes lihPenWiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}
@keyframes lihSparkle{0%,100%{opacity:0.25;transform:scale(0.85)}50%{opacity:1;transform:scale(1.1)}}
@keyframes lihCursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes lihDotPulse{0%,80%,100%{opacity:0.25}40%{opacity:1}}
@keyframes lihBubblePop{0%,100%{transform:scale(0.94);opacity:0.85}50%{transform:scale(1.03);opacity:1}}
@keyframes lihFlash{0%,85%,100%{opacity:0}92%{opacity:0.9}}
@keyframes lihCamClick{0%,88%,100%{transform:scale(1)}92%{transform:scale(0.93)}}
.lih-run-a{animation:lihBob 0.6s ease-in-out infinite;}
.lih-run-b{animation:lihBob 0.6s ease-in-out infinite;animation-delay:0.15s;}
.lih-leg-a{animation:lihLegA 0.6s ease-in-out infinite;}
.lih-leg-b{animation:lihLegB 0.6s ease-in-out infinite;}
.lih-ground{animation:lihGround 1s linear infinite;}
.lih-tail{animation:lihTailWag 0.5s ease-in-out infinite;}
.lih-scribble{animation:lihScribble 1.6s ease-in-out infinite;}
.lih-scribble-2{animation:lihScribble 1.6s ease-in-out infinite;animation-delay:0.3s;}
.lih-scribble-3{animation:lihScribble 1.6s ease-in-out infinite;animation-delay:0.6s;}
.lih-pen{animation:lihPenWiggle 0.9s ease-in-out infinite;}
.lih-sparkle{animation:lihSparkle 1.8s ease-in-out infinite;}
.lih-cursor{animation:lihCursorBlink 1s step-end infinite;}
.lih-dot1{animation:lihDotPulse 1.2s ease-in-out infinite;}
.lih-dot2{animation:lihDotPulse 1.2s ease-in-out infinite;animation-delay:0.2s;}
.lih-dot3{animation:lihDotPulse 1.2s ease-in-out infinite;animation-delay:0.4s;}
.lih-bubble{animation:lihBubblePop 2s ease-in-out infinite;}
.lih-flash{animation:lihFlash 2.4s ease-in-out infinite;}
.lih-cam{animation:lihCamClick 2.4s ease-in-out infinite;}
.ex-body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1;}
.ex-title{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3;flex:1;}
.ex-desc{font-size:11px;color:var(--ink-3);line-height:1.6;}
.btn-view{display:block;background:var(--ink);color:#fff;text-decoration:none;font-family:var(--font);font-size:11px;font-weight:600;padding:8px;border-radius:8px;text-align:center;transition:all 0.18s;margin-top:4px;}
.btn-view:hover{opacity:0.85;}
.btn-notify{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);font-family:var(--font);font-size:11px;font-weight:600;padding:8px;border-radius:8px;cursor:pointer;transition:all 0.18s;margin-top:4px;width:100%;}
.btn-notify:hover{border-color:var(--border-strong);color:var(--ink);}
.btn-notify.notified{background:var(--green-dim);color:var(--green);border-color:var(--green-border);}
.carousel-nav-row{display:flex;gap:8px;margin-top:12px;}
.cnav-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:all 0.15s;}
.cnav-btn:hover{border-color:var(--border-strong);}
.cnav-btn svg{width:12px;height:12px;}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.layout{grid-template-columns:1fr;}.sidebar{display:none;}.main{padding:24px 20px;min-width:0;}nav{padding:0 20px;}}
/* Mobile "Kursus Kamu" / "Kursus Selesai" rows — on a narrow screen there isn't
   room for idx + thumb + title + progress + button on one line. First attempt
   used flex "order" + wrap, but that's width-dependent: the short "Mulai"
   label wrapped onto its own row cleanly while the longer "Lanjutkan" label
   didn't fit the same way, landing lower and not flush to the edge. CSS Grid
   with named areas is deterministic regardless of button text length —
   idx/thumb/button always sit on row 1, title+progress always fill row 2. */
@media(max-width:560px){
  .enrolled-card{
    display:grid;
    grid-template-columns:auto auto 1fr auto;
    grid-template-areas:"idx thumb . button" "info info info info";
    align-items:center;
    column-gap:14px;
    row-gap:10px;
    padding:16px 18px;
  }

/* Onboarding modal — replaces the old profile.html?onboarding=1 redirect (checkpoint 194).
   That approach still let people reach the homepage via the nav's "Beranda" link while
   supposedly being "forced" through onboarding first. This overlay sits above the whole
   page (nav included) with no close button and no backdrop-dismiss, so there's nothing to
   navigate away to until role+goal are saved — then the page just reloads in place. */
.onb-overlay{position:fixed;inset:0;z-index:9999;background:rgba(17,17,17,0.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}

.onb-opt{padding:9px 16px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;background:#fff;transition:all 0.15s;font-family:var(--font);}
.onb-opt:hover{border-color:var(--accent);color:var(--ink);}
.onb-opt.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);font-weight:600;}
.onb-input{font-family:var(--font);font-size:13px;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;margin-top:8px;display:none;}
.onb-input:focus{outline:none;border-color:var(--accent);background:#fff;}
.onb-btn{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);transition:background 0.2s;}
.onb-btn:hover:not(:disabled){background:#000;}
.onb-btn:disabled{opacity:0.5;cursor:not-allowed;}
.onb-msg{margin-top:12px;font-size:12.5px;color:#DC2626;display:none;}

  'analisis-data':      { title:'Analisis Data & Laporan',       icon:'📊', thumb:'et4', contentLink:'coming-soon.html',              salesLink:'coming-soon.html',       desc:'Ubah data mentah jadi insight bisnis yang bisa dijadikan keputusan.',price:'Termasuk All Access', level:'Intermediate', exThumb:'ex-t2', modules:6, comingSoon:true, visible:true },
  'build-automation':   { title:'Automasi Workflow',             icon:'⚡', thumb:'et4', contentLink:'coming-soon.html',              salesLink:'coming-soon.html',       desc:'Buat 3 automation aktif dengan Zapier, Make.com & n8n.',          price:'Termasuk All Access', level:'Intermediate', exThumb:'ex-t2', modules:7, comingSoon:true, visible:true },
  'ai-powered-app':     { title:'Build AI App Sederhana',        icon:'🚀', thumb:'et4', contentLink:'coming-soon.html',              salesLink:'coming-soon.html',       desc:'Buat web app AI live di GitHub Pages — tanpa backend.',           price:'Termasuk All Access', level:'Advanced',     exThumb:'ex-t3', modules:7, comingSoon:true, visible:true },
  'claude-api-dev':     { title:'Claude API untuk Developer',    icon:'🔌', thumb:'et4', contentLink:'coming-soon.html',              salesLink:'coming-soon.html',       desc:'Integrasikan Claude ke project nyata: streaming, tool use, caching.',price:'Termasuk All Access', level:'Advanced',     exThumb:'ex-t3', modules:7, comingSoon:true, visible:true },
  'jual-produk-ai':     { title:'Build & Monetisasi Produk AI',  icon:'💰', thumb:'et4', contentLink:'coming-soon.html',              salesLink:'coming-soon.html',       desc:'Dari ide ke produk AI yang menghasilkan uang: Framer + Midtrans.', price:'Termasuk All Access', level:'Advanced',     exThumb:'ex-t3', modules:7, comingSoon:true, visible:true },
};
// Explore-grid slug order — starts as ALL_COURSES' own key order, re-sorted once the
// live course_visibility fetch below reports each course's admin-set sort_order (see
// the visibility merge block, which also updates this array).
var ALL_COURSES_ORDER=Object.keys(ALL_COURSES);

let progressMap = {}, userProfile = null, currentEmail = null;

async function loadProgress(email,preFetched){
  try{
    var r=preFetched||await sbClient.from('module_completions').select('course_slug,module_num').eq('email',email);
    if(r.data){
      r.data.forEach(function(row){
        if(!progressMap[row.course_slug])progressMap[row.course_slug]=new Set();
        progressMap[row.course_slug].add(row.module_num);
      });
      Object.keys(progressMap).forEach(function(slug){localStorage.setItem('klaud_progress_'+slug,progressMap[slug].size);});
    }
  }catch(e){}
}
function getProgress(slug){
  var total=(ALL_COURSES[slug]&&ALL_COURSES[slug].modules)||0;
  if(total===0)return{done:0,total:0,pct:100};
  // Trust the DB (progressMap, populated by loadProgress before this is ever called) as the
  // sole source of truth. Do NOT fall back to localStorage here — a course with zero real
  // completions has no entry in progressMap, which used to look identical to "fetch failed"
  // and silently resurrect a stale cached count from a previous browser session/test account.
  var done=(progressMap[slug]&&progressMap[slug].size)||0;
  return{done:done,total:total,pct:Math.min(100,Math.round((done/total)*100))};
}
function getInitials(name){return name.split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();}
// Same escaping approach as community.html/admin.html — used below wherever a
// user-editable value (like profiles.full_name) gets inserted via innerHTML
// instead of textContent, so a display name containing HTML can't inject markup
// into your own page when you view it. Self-XSS only (you'd have to attack your
// own session), but worth being consistent about.
function escapeHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

async function notifyMe(btn,slug){
  btn.disabled=true;
  try{
    var s=await sbClient.auth.getSession();
    if(s.data.session){await sbClient.from('waitlist').upsert({email:s.data.session.user.email,course_slug:slug},{onConflict:'email,course_slug',ignoreDuplicates:true});}
  }catch(e){}
  btn.classList.add('notified');btn.textContent='Terdaftar ✓';
}

// No longer called from the dashboard's "Jelajahi Kursus" cards (see the cta logic in
// _init() below) — those now link to the course's own sales page instead of enrolling
// in one click, so an All Access holder previews the course first, same as anyone else.
// Left in place since each course's own sales page (e.g. mulai-claude.html's
// enrollAndOpen()) does its own equivalent insert; this was the dashboard-side twin.
async function enrollCourse(btn,slug){
  var meta=ALL_COURSES[slug];
  if(!meta||!currentEmail)return;
  btn.disabled=true;btn.textContent='Memproses...';
  try{
    var ins=await sbClient.from('enrollments').insert({email:currentEmail,course_slug:slug,course_name:meta.title,type:'paid',enrolled_at:new Date().toISOString()});
    if(ins.error)throw ins.error;
    window.location.reload();
  }catch(e){
    btn.disabled=false;btn.textContent='Mulai Kursus →';
    alert('Gagal mendaftar kursus: '+(e.message||'Terjadi kesalahan, coba lagi.'));
  }
}
function scrollExplore(dir){document.getElementById('exploreGrid').scrollBy({left:dir*224,behavior:'smooth'});}

function spotRipple(e){
  var btn=e.currentTarget;
  var rect=btn.getBoundingClientRect();
  var ripple=document.createElement('span');
  var size=Math.max(rect.width,rect.height);
  ripple.className='spot-ripple';
  ripple.style.width=ripple.style.height=size+'px';
  ripple.style.left=(e.clientX-rect.left-size/2)+'px';
  ripple.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.appendChild(ripple);
  setTimeout(function(){ripple.remove();},600);
}
async function logout(){await sbClient.auth.signOut();window.location.href='index.html';}

// Onboarding modal wiring — same preset-button + "Lainnya" free-text pattern as
// profile.html's setupOtherOption(), reimplemented here since the modal has its own
// element ids and only needs role+goal (not the full profile form).
var onbAnswers={role:null,goal:null};
function onbSelect(groupId,inputId,key,val){
  onbAnswers[key]=val;
  document.querySelectorAll('#'+groupId+' .onb-opt').forEach(function(b){
    b.classList.toggle('selected',b.getAttribute('data-val')===val);
  });
  var otherInput=document.getElementById(inputId);
  if(val==='__other__'){otherInput.style.display='block';otherInput.focus();onbAnswers[key]=otherInput.value.trim();}
  else{otherInput.style.display='none';otherInput.value='';}
}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('#onbOptsRole .onb-opt').forEach(function(b){
    b.addEventListener('click',function(){onbSelect('onbOptsRole','onbRoleOther','role',b.getAttribute('data-val'));});
  });
  document.querySelectorAll('#onbOptsGoal .onb-opt').forEach(function(b){
    b.addEventListener('click',function(){onbSelect('onbOptsGoal','onbGoalOther','goal',b.getAttribute('data-val'));});
  });
  document.getElementById('onbRoleOther').addEventListener('input',function(){onbAnswers.role=this.value.trim();});
  document.getElementById('onbGoalOther').addEventListener('input',function(){onbAnswers.goal=this.value.trim();});
});
async function saveOnboarding(){
  var btn=document.getElementById('onbSaveBtn');
  var msg=document.getElementById('onbMsg');
  msg.style.display='none';
  if(!onbAnswers.role||!onbAnswers.goal){
    msg.textContent='Pilih dulu kedua pertanyaan di atas ya (atau isi kolom "Lainnya").';
    msg.style.display='block';
    return;
  }
  btn.disabled=true;btn.textContent='Menyimpan...';
  try{
    // Only role/goal/updated_at in the payload — Supabase upsert only touches the
    // columns sent, so any existing full_name/username (e.g. set separately via
    // profile.html) is left alone, not nulled out.
    await sbClient.from('profiles').upsert({
      email:currentEmail, role:onbAnswers.role, goal:onbAnswers.goal, updated_at:new Date().toISOString()
    },{onConflict:'email'});
    window.location.reload();
  }catch(e){
    console.error(e);
    msg.textContent='Gagal menyimpan. Coba lagi.';
    msg.style.display='block';
    btn.disabled=false;btn.textContent='Simpan & Lanjutkan →';
  }
}

async function init(){
  try{await _init();}catch(err){
    console.error(err);
    document.getElementById('loadingScreen').style.display='none';
    document.getElementById('mainLayout').style.display='grid';
  }
}
async function _init(){
  var sr=await sbClient.auth.getSession();
  var session=sr.data.session;
  if(!session){window.location.href='login.html';return;}
  currentEmail=session.user.email;
  var ADMIN_EMAILS=['julia.utomo@gmail.com','tiffany.utomo@gmail.com'];
  if(ADMIN_EMAILS.indexOf(currentEmail.toLowerCase())!==-1){document.getElementById('adminNavItem').style.display='flex';}

  // profiles / module_completions / course_visibility / enrollments don't depend on
  // each other's results, only (at most) on currentEmail — this used to be up to 4
  // sequential Supabase round trips in a row (profile → progress → visibility →
  // enrollments), each one waiting on the last. Firing them together via
  // Promise.allSettled means we only pay for whichever one is slowest, not the sum of
  // all four. Passing the query builders directly into the array (rather than assigning
  // them to variables and awaiting each individually later) is what actually makes this
  // concurrent — supabase-js builders are lazy and don't hit the network until something
  // calls .then() on them, which Promise.allSettled does for every item up front.
  var settled=await Promise.allSettled([
    sbClient.from('profiles').select('*').eq('email',currentEmail).maybeSingle(),
    sbClient.from('module_completions').select('course_slug,module_num').eq('email',currentEmail),
    sbClient.from('course_visibility').select('*'),
    sbClient.from('enrollments').select('course_slug,course_name,type,enrolled_at,last_accessed_at').eq('email',currentEmail).order('enrolled_at',{ascending:false})
  ]);

  userProfile=(settled[0].status==='fulfilled'&&settled[0].value.data)||null;

  // Onboarding gate: force profile completion (role + goal) before the dashboard is
  // shown — mainly hits right after a purchase, when a fresh account has neither set
  // yet. Used to redirect to profile.html?onboarding=1, but that page still had a
  // working "Beranda" nav link, so the "forced" step had an escape hatch to the
  // homepage. Now it's an in-page modal (see .onb-overlay) that covers the whole
  // viewport including nav, with no close button — the only way past it is saving
  // role+goal, which just reloads this page. Skipped entirely once both are set.
  if(!userProfile||!userProfile.role||!userProfile.goal){
    document.getElementById('loadingScreen').style.display='none';
    document.getElementById('onbOverlay').style.display='flex';
    return;
  }

  var name=(userProfile&&userProfile.full_name)||(session.user.user_metadata&&session.user.user_metadata.full_name)||currentEmail.split('@')[0];
  // Sidebar/nav/greeting all show first-name-only now — full name stays reserved for
  // the editable "Nama Lengkap" field on profile.html, so it's still saved/editable
  // in full, just not displayed everywhere.
  var firstName=name.trim().split(/\s+/)[0];
  var joinDate=new Date(session.user.created_at).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  var initials=getInitials(firstName);
  document.getElementById('navAvatar').textContent=initials;
  document.getElementById('sideName').textContent=firstName;
  document.getElementById('sideEmail').textContent=currentEmail;
  document.getElementById('sideSince').textContent='Bergabung '+joinDate;
  var hour=new Date().getHours();
  var greet=hour<12?'Selamat pagi':hour<17?'Selamat siang':'Selamat malam';
  document.getElementById('greetEyebrow').textContent=greet+' ·';
  document.getElementById('greetH1').innerHTML='Selamat datang kembali,<br><em>'+escapeHtml(firstName)+'</em>';

  // Already fetched above (settled[1]) — loadProgress() now just processes a result
  // instead of also fetching it, so the 2nd argument skips a redundant network call.
  await loadProgress(currentEmail, settled[1].status==='fulfilled'?settled[1].value:{data:[]});

  // Live visibility overrides from the admin toggle (course_visibility table) — falls
  // back to each course's static comingSoon/visible defaults in ALL_COURSES above if
  // this fetch fails, so a Supabase hiccup never exposes/hides something unexpectedly.
  try{
    if(settled[2].status==='fulfilled'){
      var vr=settled[2].value;
      // dev_preview lets admin.html unhide a course on the dev deployment only
      // (hostname starting with "dev-") without it going live on production.
      var IS_DEV_ENV=/^dev-/.test(location.hostname);
      (vr.data||[]).forEach(function(row){
        if(!ALL_COURSES[row.course_slug])return;
        ALL_COURSES[row.course_slug].hidden=(IS_DEV_ENV&&row.dev_preview)?false:!!row.hidden;
        ALL_COURSES[row.course_slug].comingSoon=!!row.coming_soon;
        ALL_COURSES[row.course_slug].visible=true;
        if(row.sort_order!=null)ALL_COURSES[row.course_slug].sortOrder=row.sort_order;
      });
      // Admin-set sort_order drives the explore-grid order — re-sort in place so the
      // Object.keys(ALL_COURSES) usage further down (unenrolled grid) picks it up.
      var fallbackIdx={};
      ALL_COURSES_ORDER.forEach(function(slug,i){fallbackIdx[slug]=i+1;});
      ALL_COURSES_ORDER=ALL_COURSES_ORDER.slice().sort(function(a,b){
        var oa=(ALL_COURSES[a]&&ALL_COURSES[a].sortOrder!=null)?ALL_COURSES[a].sortOrder:fallbackIdx[a];
        var ob=(ALL_COURSES[b]&&ALL_COURSES[b].sortOrder!=null)?ALL_COURSES[b].sortOrder:fallbackIdx[b];
        return oa-ob;
      });
    }
  }catch(e){}

  var er=settled[3].status==='fulfilled'?settled[3].value:{data:[]};
  var rawEnrollments=(er.data||[]);
  // 'mulai-claude' is no longer free-standing (moved behind All Access) - drop any
  // legacy free enrollment rows for it so the dashboard doesn't show it as owned
  // unless the user actually has all-access (which re-adds it further below).
  var hasRealAllAccess=rawEnrollments.some(function(e){return e.course_slug==='all-access';});
  var LEGACY_FREE_SLUGS=['mulai-claude','prompt-gratis'];
  if(!hasRealAllAccess){rawEnrollments=rawEnrollments.filter(function(e){return LEGACY_FREE_SLUGS.indexOf(e.course_slug)===-1;});}
  var PAKET_COURSES={'paket-karyawan':['mulai-claude','produktivitas','analisis-data'],'paket-mahasiswa':['mulai-claude','analisis-data'],'paket-pengusaha':['mulai-claude','content-marketing','build-automation'],'paket-creator':['mulai-claude','content-marketing']};
  var existingSlugs=new Set(rawEnrollments.map(function(e){return e.course_slug;}));
  var paketExpanded=rawEnrollments.slice();
  rawEnrollments.forEach(function(e){if(PAKET_COURSES[e.course_slug]){PAKET_COURSES[e.course_slug].forEach(function(slug){if(!existingSlugs.has(slug)){existingSlugs.add(slug);paketExpanded.push({course_slug:slug,course_name:(ALL_COURSES[slug]&&ALL_COURSES[slug].title)||slug,type:'paid',enrolled_at:e.enrolled_at,last_accessed_at:null});}});}});
  // All Access sentinel: one 'all-access' enrollment row grants ACCESS to every course in
  // ALL_COURSES (content pages check for this row directly), but no longer auto-populates
  // "Kursus Kamu" - the user still has to visit the course's own sales page and enroll
  // from there (same preview-first flow as any other visitor), which inserts a real
  // per-course enrollment row. This keeps the dashboard from listing every course the
  // moment someone buys all-access.
  var allAccessRow=rawEnrollments.find(function(e){return e.course_slug==='all-access';});
  var enrollments=paketExpanded.filter(function(e){return ALL_COURSES[e.course_slug];});
  var enrolledSlugs=new Set(enrollments.map(function(e){return e.course_slug;}));

  var activeCourses=[],completedCourses=[],totalModules=0;
  Object.keys(progressMap).forEach(function(slug){totalModules+=(progressMap[slug]&&progressMap[slug].size)||0;});
  enrollments.forEach(function(c){
    var prog=getProgress(c.course_slug);
    if(prog.pct===100)completedCourses.push(c.course_slug);
    else activeCourses.push(c);
  });

  var statC=completedCourses.length,statE=enrollments.length;
  var sc=document.getElementById('statCompleted'); if(sc) sc.textContent=statC;
  var se=document.getElementById('statEnrolled'); if(se) se.textContent=statE;
  var scb=document.getElementById('statCompletedBig'); if(scb) scb.textContent=statC;
  var seb=document.getElementById('statEnrolledBig'); if(seb) seb.textContent=statE;

  if(statC>0){
    var pill=document.getElementById('greetPill');
    pill.textContent='✦  '+statC+' kursus diselesaikan';
    pill.style.display='flex';
  }

  // Coming-soon courses are NOT injected into "Kursus Kamu" — even with All Access,
  // a course only becomes "yours" once you explicitly enroll (click "Mulai Kursus" in
  // Jelajahi Kursus below, which inserts a real per-course enrollment row). A coming-soon
  // course can't be enrolled in yet, so it doesn't belong here; it still surfaces as a
  // disabled "Segera Hadir" card in the explore/Jelajahi Kursus grid further down.

  var COURSE_ORDER={'prompt-gratis':0,'mulai-claude':1,'produktivitas':2,'content-marketing':3,'claude-sehari-hari':4,'strategi-marketing':5,'analisis-data':6,'build-automation':7,'ai-powered-app':8,'claude-api-dev':9,'jual-produk-ai':10};
  function courseSort(a,b){return (COURSE_ORDER[a.course_slug]||99)-(COURSE_ORDER[b.course_slug]||99);}
  activeCourses.sort(courseSort);

  // Spotlight: highlight whichever active (enrolled, not yet 100%) course was opened
  // most recently (last_accessed_at, set by the course-content pages on load), so it
  // reads as "pick up where you left off" rather than "here's what you're closest to
  // finishing". Courses never opened yet (null) sort last; ties/no-visits-at-all fall
  // back to activeCourses[0], already sorted by COURSE_ORDER.
  if(activeCourses.length>0){
    var spotCourse=activeCourses.reduce(function(best,c){
      var cTime=c.last_accessed_at?new Date(c.last_accessed_at).getTime():0;
      var bTime=best.last_accessed_at?new Date(best.last_accessed_at).getTime():0;
      return cTime>bTime?c:best;
    },activeCourses[0]);
    var spotMeta=ALL_COURSES[spotCourse.course_slug],spotProg=getProgress(spotCourse.course_slug);
    var circumference=264; // 2*pi*42, matches the ring's r=42
    document.getElementById('spotRingFill').style.strokeDashoffset=circumference-(circumference*spotProg.pct/100);
    document.getElementById('spotPct').textContent=spotProg.pct+'%';
    document.getElementById('spotTitle').textContent=spotMeta.icon+' '+spotMeta.title;
    var remaining=spotProg.total-spotProg.done;
    document.getElementById('spotMeta').innerHTML=spotProg.done>0
      ?'<b>'+spotProg.done+'/'+spotProg.total+' modul</b> selesai'+(remaining===1?' — tinggal 1 lagi buat kelar!':remaining>0?' — '+remaining+' modul lagi menuju selesai.':'.')
      :'<b>'+spotProg.total+' modul</b> menunggu — yuk mulai!';
    document.querySelector('#spotlightSection .spot-eyebrow').lastChild.textContent=spotProg.done>0?'Lanjutkan belajar':'Mulai belajar';
    var spotBtn=document.getElementById('spotBtn');
    spotBtn.innerHTML=(spotProg.done>0?'Lanjutkan':'Mulai')+' <span>&rarr;</span>';
    document.getElementById('spotCard').onclick=function(){location.href=spotMeta.contentLink;};
    document.getElementById('spotlightSection').style.display='block';
  }

  var thumbs=['et1','et2','et3','et4'];
  function renderEnrolledCard(c,i,list){
    var meta=ALL_COURSES[c.course_slug],prog=getProgress(c.course_slug);
    var isDone=prog.pct===100;
    var isComingSoon=!!meta.comingSoon;
    var btnLabel=prog.done>0?'Lanjutkan':'Mulai';
    var statusTag=isDone?'<span style="font-size:11px;font-weight:700;background:#DCFCE7;color:#16A34A;padding:2px 10px;border-radius:100px;margin-left:10px;">Selesai ✓</span>':isComingSoon?'<span style="font-size:11px;font-weight:700;background:#F4F4F5;color:#71717A;padding:2px 10px;border-radius:100px;margin-left:10px;">Segera Hadir</span>':'';
    var cardClick=isComingSoon?'':' onclick="location.href=\''+meta.contentLink+'\'"';
    var actionBtn=isComingSoon
      ?'<span class="resume-btn" style="background:#F4F4F5;color:#9CA3AF;cursor:default;pointer-events:none;">Segera Hadir</span>'
      :'<a href="'+meta.contentLink+'" class="resume-btn" onclick="event.stopPropagation()">'+btnLabel+' &rarr;</a>';
    // Coming-soon preview cards aren't real enrollments — no progress to show, so skip
    // the 0%/0-of-N progress bar entirely (it read as "you're enrolled" otherwise) and
    // show a plain module-count note instead.
    var progRow=isComingSoon
      ?'<div class="prog-row"><span class="prog-lbl" style="color:#9CA3AF;">Belum tersedia — '+prog.total+' modul direncanakan</span></div>'
      :'<div class="prog-row"><span class="prog-pct">'+prog.pct+'%</span><div class="prog-bar"><div class="prog-fill" style="width:'+prog.pct+'%"></div></div>'
      +'<span class="prog-lbl">'+Math.min(prog.done,prog.total)+'/'+prog.total+'</span></div>';
    list.innerHTML+='<div class="enrolled-card"'+cardClick+'>'
      +'<span class="enrolled-idx">'+String(i+1).padStart(2,'0')+'</span>'
      +'<div class="enrolled-thumb '+thumbs[i%4]+'">'+meta.icon+'</div>'
      +'<div class="enrolled-info"><h3>'+meta.title+statusTag+'</h3>'
      +progRow+'</div>'
      +actionBtn
      +'</div>';
  }

  if(activeCourses.length>0){
    document.getElementById('enrolledSection').style.display='block';
    var list=document.getElementById('enrolledList');
    activeCourses.forEach(function(c,i){renderEnrolledCard(c,i,list);});
  }

  if(completedCourses.length>0){
    document.getElementById('completedSection').style.display='block';
    var clist=document.getElementById('completedList');
    var sortedCompleted=completedCourses.map(function(s){return{course_slug:s};}).sort(courseSort);
    sortedCompleted.forEach(function(c,i){renderEnrolledCard(c,i,clist);});
  }



  // Coming-soon (not-yet-launched) courses stay hidden here entirely, even when
  // unenrolled — same "hidden means hidden" rule as everywhere else on the site —
  // UNLESS explicitly marked `visible:true`, which shows it greyed/disabled instead
  // of hiding it (same exception pattern used for Strategi & Analisis Marketing
  // elsewhere on the site: visible-but-unclickable, not a full hide).
  var unenrolled=ALL_COURSES_ORDER.filter(function(slug){return!ALL_COURSES[slug].hidden&&!enrolledSlugs.has(slug)&&(!ALL_COURSES[slug].comingSoon||ALL_COURSES[slug].visible);});
  if(unenrolled.length>0){
    document.getElementById('exploreSection').style.display='block';
    var grid=document.getElementById('exploreGrid');
    unenrolled.forEach(function(slug){
      var meta=ALL_COURSES[slug];
      // Always link to the course's own sales/preview page first — even for All Access
      // holders — instead of a one-click auto-enroll button. Matches the experience of
      // browsing from index.html: preview the course, then enroll from its own page.
      var cta=meta.comingSoon
          ?'<span class="btn-view" style="cursor:default;pointer-events:none;">Segera Hadir</span>'
          :'<a href="'+meta.salesLink+'" class="btn-view">Lihat Kursus &rarr;</a>';
      // Same hand-drawn illustrations as index.html's course-library grid (shared via
      // course-illustrations.js), falling back to the plain emoji-in-a-color-box
      // treatment for slugs that don't have a custom illustration yet (most "coming
      // soon" courses).
      var exVisual = (typeof LIH_ILLUSTRATIONS !== 'undefined' && LIH_ILLUSTRATIONS[slug]) || meta.icon;
      var exBg = (typeof LIH_BG !== 'undefined' && LIH_BG[slug]) ? 'background:' + LIH_BG[slug] + ';' : '';
      var exClass = exBg ? '' : ' ' + meta.exThumb;
      grid.innerHTML+='<div class="explore-card'+(meta.comingSoon?' cc-soon':'')+'">'
        +'<div class="ex-thumb'+exClass+'" style="'+exBg+'">'+exVisual+'</div>'
        +'<div class="ex-body">'
        +'<div class="ex-title">'+meta.title+'</div>'
        +'<div class="ex-desc">'+meta.desc+'</div>'
        +cta+'</div></div>';
    });
  }

  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('mainLayout').style.display='grid';
}
init();
</script>
</body>
</html>
