<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="posthog-config.js"></script>
  <title>Masuk — Belajar Claude</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAFA; --surface: #FFFFFF; --surface-2: #F5F5F7;
      --border: #E8E8E8; --border-strong: #D0D0D0;
      --ink: #111111; --ink-2: #777777; --ink-3: #BBBBBB;
      --accent: #6C47FF; --accent-2: #9B7DFF;
      --accent-dim: rgba(108,71,255,0.08); --accent-glow: rgba(108,71,255,0.18);
      --green: #16A34A; --green-dim: rgba(22,163,74,0.08); --green-border: rgba(22,163,74,0.2);
      --gold: #EF9F27; --gold-pale: rgba(239,159,39,0.08);
      --shadow: 0 1px 4px rgba(0,0,0,0.06), 0 4px 20px rgba(0,0,0,0.05);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.04);
      --serif: 'Fraunces', Georgia, serif;
      --font: 'Geist', sans-serif;
      --r: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle, #D8D8DC 1px, transparent 1px);
      background-size: 26px 26px; opacity: 0.5;
      mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, black 20%, transparent 80%);
    }
    .card {
      background: #fff; border-radius: 20px; padding: 44px 40px 36px;
      max-width: 400px; width: 100%;
      box-shadow: 0 4px 40px rgba(0,0,0,0.08);
      border: 1px solid var(--border); position: relative; z-index: 1;
    }
    .logo { font-family: var(--font); font-size: 17px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.4px; margin-bottom: 28px; display: block; }
    .logo span { color: var(--accent); }

    /* Tabs */
    .tabs { display: flex; margin-bottom: 28px;
      border-bottom: 1.5px solid var(--border); }
    .tab-btn {
      flex: 1; background: none; border: none; padding: 10px 0;
      font-family: var(--font); font-size: 14px; font-weight: 600;
      color: var(--ink-2); cursor: pointer; position: relative;
      transition: color 0.15s;
    }
    .tab-btn.active { color: var(--accent); }
    .tab-btn.active::after {
      content: ''; position: absolute; bottom: -1.5px; left: 0; right: 0;
      height: 2px; background: var(--accent); border-radius: 2px 2px 0 0;
    }

    label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="email"], input[type="password"], .pw-wrap input[type="text"] {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 14px; color: var(--ink); outline: none;
      transition: border-color 0.2s; margin-bottom: 14px;
      font-family: inherit; background: #fff;
    }
    input[type="email"]:focus, input[type="password"]:focus, .pw-wrap input[type="text"]:focus { border-color: var(--accent); }

    /* Password field with a show/hide toggle icon on the right — styled to
       look like one continuous box with the email field above it. */
    .pw-wrap { position: relative; width: 100%; margin-bottom: 14px; }
    .pw-wrap input[type="password"], .pw-wrap input[type="text"] {
      width: 100%; box-sizing: border-box; padding-right: 42px; margin-bottom: 0;
    }
    /* Hide browser-native reveal/clear icons (Edge, some Chromium builds) so
       they don't double up with our own eye icon and squeeze the input. */
    input[type="password"]::-ms-reveal, input[type="password"]::-ms-clear { display: none; }
    input::-webkit-credentials-auto-fill-button { display: none !important; }
    input::-webkit-strong-password-auto-fill-button { display: none !important; }
    .pw-toggle {
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px; margin: 0;
      background: transparent; background-color: transparent;
      border: none; box-shadow: none; outline: none; padding: 0;
      border-radius: 8px; cursor: pointer;
      color: var(--ink-3); display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, background-color 0.15s;
    }
    .pw-toggle:hover { color: var(--ink-2); background-color: var(--surface-2); }
    .pw-toggle:focus-visible { box-shadow: 0 0 0 2px var(--accent-glow); }
    .pw-toggle svg { width: 18px; height: 18px; display: block; }
    .pw-toggle .icon-eye-off { display: none; }
    .pw-toggle.showing .icon-eye { display: none; }
    .pw-toggle.showing .icon-eye-off { display: block; }
    .btn {
      width: 100%; padding: 13px;
      background: var(--ink); color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
      font-family: inherit; margin-top: 2px;
    }
    .btn:hover:not(:disabled) { background: #333; }
    .btn:disabled { background: #9CA3AF; cursor: not-allowed; }

    .forgot-link {
      display: block; text-align: right; font-size: 12px;
      color: var(--accent); margin-top: -8px; margin-bottom: 16px;
      cursor: pointer; background: none; border: none;
      font-family: inherit; padding: 0;
    }
    .forgot-link:hover { text-decoration: underline; }

    .msg {
      margin-top: 14px; padding: 12px 14px;
      border-radius: 10px; font-size: 13px;
      text-align: center; line-height: 1.6; display: none;
    }
    .msg.success { background: #ECFDF5; color: #065F46; display: block; }
    .msg.error   { background: #FEE2E2; color: #991B1B; display: block; }

    .note { margin-top: 20px; font-size: 12px; color: #9CA3AF; text-align: center; line-height: 1.6; }
    .back { display: block; text-align: center; margin-top: 16px; font-size: 13px;
      color: var(--ink-2); text-decoration: none; }
    .back:hover { color: var(--ink); }

    .view { display: none; }
    .view.active { display: block; }

    .back-link {
      display: inline-block; margin-top: 14px; font-size: 12px;
      color: var(--accent); cursor: pointer; background: none;
      border: none; font-family: inherit; padding: 0;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="index.html">belajar<span>claude</span></a>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Masuk</button>
    </div>

    <!-- Login view -->
    <div class="view active" id="view-login">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="nama@email.com" autocomplete="email" autofocus />
      <label for="login-password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="login-password" placeholder="Password kamu" autocomplete="current-password" />
        <button type="button" class="pw-toggle" onclick="togglePw('login-password', this)" aria-label="Tampilkan password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.1 6.1C3.51 7.86 1 12 1 12s4 8 11 8a9.26 9.26 0 0 0 5.9-2.1"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <button class="forgot-link" onclick="switchView('forgot')">Lupa password?</button>
      <button class="btn" id="login-btn" onclick="doLogin()">Masuk →</button>
      <div class="msg" id="login-msg"></div>
    </div>

    <!-- Forgot password view -->
    <div class="view" id="view-forgot">
      <p style="font-size:14px;color:var(--ink-2);margin-bottom:20px;line-height:1.6;">
        Masukkan email kamu. Kami akan kirimkan link untuk buat password baru.
      </p>
      <label for="forgot-email">Email</label>
      <input type="email" id="forgot-email" placeholder="nama@email.com" />
      <button class="btn" id="forgot-btn" onclick="doForgot()">Kirim Link Reset →</button>
      <div class="msg" id="forgot-msg"></div>
      <button class="back-link" onclick="switchView('login')">← Kembali ke Masuk</button>
    </div>

    <p class="note">Dengan melanjutkan, kamu menyetujui syarat & ketentuan Belajar Claude.</p>
    <a href="index.html" class="back">← Kembali ke beranda</a>
  </div>

  <!-- Moved here from <head> (perf): these were blocking first paint on every load. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="backend-config.js"></script>
  <script>
    // Where to send the user after a successful login/register. Defaults to the
    // dashboard, but honors ?next=index.html (used by the homepage's "Masuk" link)
    // so logging in from the homepage lands back on the homepage, logged in, instead
    // of jumping straight to the dashboard. Only allows a plain same-site .html
    // filename — never a full URL — to avoid this becoming an open redirect.
    function getNextUrl() {
      var next = new URLSearchParams(window.location.search).get('next');
      return (next && /^[a-zA-Z0-9_-]+\.html$/.test(next)) ? next : 'dashboard.html';
    }

    // Redirect if already logged in
    (async function() {
      var r = await sbClient.auth.getSession();
      if (r.data.session) window.location.href = getNextUrl();
    })();

    // Shown when admin.html force-refreshes the session and it's genuinely dead
    // (rotated/expired refresh token) — clearer than a silent redirect.
    if (new URLSearchParams(window.location.search).get('expired') === '1') {
      document.addEventListener('DOMContentLoaded', function() {
        showMsg(document.getElementById('login-msg'), 'error', 'Sesi kamu sudah berakhir. Silakan masuk lagi.');
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(function(b, i) {
        b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      switchView(tab);
    }

    function switchView(view) {
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      document.getElementById('view-' + view).classList.add('active');
      document.getElementById('tabs').style.display = view === 'forgot' ? 'none' : 'flex';
    }

    async function doLogin() {
      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      var btn = document.getElementById('login-btn');
      var msg = document.getElementById('login-msg');

      if (!email || !password) return showMsg(msg, 'error', 'Isi email dan password ya.');
      btn.disabled = true; btn.textContent = 'Memproses...';
      msg.className = 'msg';

      var res = await sbClient.auth.signInWithPassword({ email: email, password: password });
      if (res.error) {
        var text = res.error.message.includes('Invalid login credentials')
          ? 'Email atau password salah. Belum punya password? Klik "Lupa password?" untuk buat password baru.'
          : res.error.message;
        showMsg(msg, 'error', text);
        btn.disabled = false; btn.textContent = 'Masuk →';
      } else {
        btn.textContent = 'Berhasil!';
        window.location.href = getNextUrl();
      }
    }

    async function doForgot() {
      var email = document.getElementById('forgot-email').value.trim();
      var btn = document.getElementById('forgot-btn');
      var msg = document.getElementById('forgot-msg');

      if (!email || !email.includes('@')) return showMsg(msg, 'error', 'Masukkan email yang valid ya.');
      btn.disabled = true; btn.textContent = 'Mengirim...';
      msg.className = 'msg';

      // redirectTo must match whichever hostname this page is actually loaded from —
      // hardcoding production here sends dev-site "Lupa password?" users to production's
      // reset-password.html (and, after resetting, production's dashboard.html), the same
      // class of bug the Duitku widget script had. Mirrors FRONTEND_URL's env split.
      var res = await sbClient.auth.resetPasswordForEmail(email, {
        redirectTo: (location.hostname === 'belajarclaude.id'
          ? 'https://belajarclaude.id'
          : 'https://dev-belajar-claude.belajarclaude-id.workers.dev') + '/reset-password.html'
      });
      if (res.error) {
        showMsg(msg, 'error', res.error.message);
        btn.disabled = false; btn.textContent = 'Kirim Link Reset →';
      } else {
        showMsg(msg, 'success', 'Link reset sudah dikirim ke ' + email + '. Cek inbox kamu.');
        btn.textContent = 'Terkirim!';
      }
    }

    function togglePw(inputId, btn) {
      var input = document.getElementById(inputId);
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.classList.toggle('showing', !showing);
      btn.setAttribute('aria-label', showing ? 'Tampilkan password' : 'Sembunyikan password');
    }

    function showMsg(el, type, text) {
      el.textContent = text; el.className = 'msg ' + type;
    }

    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      var active = document.querySelector('.view.active');
      if (!active) return;
      if (active.id === 'view-login') doLogin();
      else if (active.id === 'view-forgot') doForgot();
    });
  </script>
</body>
</html>
